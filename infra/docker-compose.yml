name: stat-cave

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -s3 -s3.port=8333 -dir=/data -volume.max=500
    restart: unless-stopped
    ports:
      - "8333:8333"
      - "9333:9333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweed-data:/data

  polaris-db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POLARIS_DB_PASSWORD}
    volumes:
      - polaris-db:/var/lib/postgresql/data
      - ./polaris/create-schema.sql:/docker-entrypoint-initdb.d/create-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U polaris -d polaris" ]
      interval: 5s
      timeout: 5s
      retries: 20

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    restart: "no"
    environment: &polaris-db-env
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD}
    command: [ "bootstrap", "--realm=POLARIS", "--credential=POLARIS,${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}" ]
    depends_on:
      polaris-db:
        condition: service_healthy

  polaris:
    image: apache/polaris:1.8.0
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "8181:8181"
    environment:
      <<: *polaris-db-env
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      AWS_REGION: us-east-2
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8182/q/health" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started

volumes:
  seaweed-data:
  polaris-db:
